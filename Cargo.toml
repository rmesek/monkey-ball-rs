[workspace]
resolver = "2"
members = ["crates/mb-assets", "crates/mb-engine", "crates/mb-tpl", "crates/mb-gma", "crates/mb-stage", "crates/mb-audio", "crates/mb-render", "crates/mb-app", "crates/mb-web", "crates/mb-game", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# Third-party dependencies (graphics, audio, serialization, windowing, ...) are
# intentionally NOT chosen yet. Add them in the phase that needs them.
