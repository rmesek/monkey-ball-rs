[workspace]
resolver = "3"
members = [
    # Files and formats (std only).
    "crates/mb-assets", "crates/mb-stage", "crates/mb-tpl", "crates/mb-gma", "crates/mb-audio",
    # Simulation and rules (std only).
    "crates/mb-engine", "crates/mb-game",
    # Drawing (wgpu) and the game itself: the same on every platform.
    "crates/mb-render", "crates/mb-app",
    # One crate per platform.
    "crates/mb-desktop", "crates/mb-web",
    "xtask",
]
# What plain `cargo run --release` builds and runs: the desktop program.
default-members = ["crates/mb-desktop"]

[workspace.package]
version = "0.3.0"
edition = "2024"
# The lowest release clippy's MSRV lint accepts for the standard library calls in use. Only the stable
# toolchain of rust-toolchain.toml has built the code.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

# Third-party dependencies are declared per crate, each with a one-line reason (AGENTS.md, hard rule 7).
# The stack is recorded in docs/PLAN.md and docs/ARCHITECTURE.md: wgpu, glam, bytemuck, ruzstd, web-time
# everywhere; winit in the platform crates; cpal and pollster on native targets; rfd and gilrs on the desktop;
# wasm-bindgen, web-sys and js-sys in the browser. Nothing that talks to a network.

# Browser bundle (`cargo run --release -p xtask -- build-web` builds mb-web with `--profile web`). Whole-program optimisation
# pays here: the wasm is downloaded and compiled by every visitor and runs on phones. Measured against plain
# `--release` in docs/WEB.md. Kept out of `release` so native builds stay quick to link.
[profile.web]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
# No unwinding in the browser anyway; the panic hook still reports the message before the trap.
panic = "abort"
strip = "debuginfo"
