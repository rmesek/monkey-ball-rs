# Fills a GitHub release with the builds of its version. It starts when a release is published on the
# website and from nothing else: pushing commits or tags spends no Actions minutes. To publish: set the
# version in Cargo.toml, commit, tag that commit vX.Y.Z, push main and the tag, then on GitHub choose
# Releases -> Draft a new release, pick the tag and publish. The files appear on the release as the jobs
# finish. A tag whose commit names another version in Cargo.toml is refused.
#
# Kept cheap deliberately: the Linux job (1x minutes) runs the gates and builds everything that can be built
# on Linux; Windows (2x) and macOS (10x) only build the executable, and only after the gates passed. Every
# job has a timeout, so a hung run costs at most 60 + 2 * 30 + 10 * 20 billed minutes. Files go straight to
# the release, not through Actions artifacts or caches, which have their own storage quota. If one job
# fails, use "Re-run failed jobs": the others are not paid for again.
name: release
on:
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: release-${{ github.event.release.tag_name }}
env:
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ github.event.release.tag_name }}
  # A fresh runner gains nothing from incremental compilation.
  CARGO_INCREMENTAL: 0
defaults:
  run:
    shell: bash
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # A release event checks out the release's tag.
      - uses: actions/checkout@v4
      # Refuse a mismatched tag first, before any minute is spent compiling.
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          [[ "$TAG" == "v$version" ]] || { echo "::error::the release's tag is $TAG but Cargo.toml at that commit says $version (expected the tag v$version)"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # rust-toolchain.toml names the toolchain, its components and the wasm32 and Android targets.
      - run: rustup show
      # Headers for the desktop crates' Linux backends (audio, gamepads, the file dialog, windowing).
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libgtk-3-dev libxkbcommon-dev libwayland-dev
      # The same gates as on a developer's machine. The runner has no disc image, so the tests that need the
      # game skip, and the browser check is not run: do both locally before tagging.
      - run: cargo xtask ci
      # The desktop program as shipped; reuses the dependencies the release-mode tests just built.
      - run: cargo build -p mb-desktop --release --locked
      - run: cargo xtask build-web
      - name: Attach the Linux executable and the web site
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tar -czf "$RUNNER_TEMP/mb-app-$VERSION-linux-x86_64.tar.gz" -C target/release monkey-ball
          # The static site as it is served: unpack it anywhere under a web server.
          tar -czf "$RUNNER_TEMP/monkey-ball-web-$VERSION.tar.gz" -C target/site .
          gh release upload "$TAG" "$RUNNER_TEMP/mb-app-$VERSION-linux-x86_64.tar.gz" "$RUNNER_TEMP/monkey-ball-web-$VERSION.tar.gz" --clobber
  desktop:
    needs: linux
    strategy:
      # One platform failing must not cancel the other: its minutes are already spent.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
            timeout: 30
          # macos-latest is Apple silicon.
          - os: macos-latest
            name: macos-arm64
            timeout: 20
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      ARCHIVE: monkey-ball-${{ needs.linux.outputs.version }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo build -p mb-desktop --release --locked
      - name: Attach the executable
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            (cd target/release && 7z a "$RUNNER_TEMP/$ARCHIVE.zip" monkey-ball.exe)
            gh release upload "$TAG" "$RUNNER_TEMP/$ARCHIVE.zip" --clobber
          else
            tar -czf "$RUNNER_TEMP/$ARCHIVE.tar.gz" -C target/release monkey-ball
            gh release upload "$TAG" "$RUNNER_TEMP/$ARCHIVE.tar.gz" --clobber
          fi
