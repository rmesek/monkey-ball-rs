[package]
name = "mb-assets"
description = "Disc image and RVZ readers, LZSS, pack providers and the on-device game pack (no GPU deps)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Pure-Rust Zstandard decoder for the RVZ reader (`src/rvz.rs`): Dolphin compresses RVZ images with Zstandard
# by default. No C toolchain needed on any target, including wasm32.
ruzstd = "0.8"

[dev-dependencies]
# Reference disc reader, tests only: `tests/disc.rs` proves the built-in readers (`src/disc.rs`, `src/rvz.rs`)
# list and read the same files. Not part of any shipped binary.
nod = "2.0.0-alpha.9"
