[package]
name = "mb-assets"
description = "GameCube disc image and RVZ readers, LZSS, and the on-device game pack format (no GPU or OS-specific code)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Pure-Rust Zstandard decoder for the RVZ reader (`src/rvz.rs`): Dolphin compresses RVZ images with Zstandard
# by default. No C toolchain needed on any target, including wasm32.
ruzstd = "0.8"
