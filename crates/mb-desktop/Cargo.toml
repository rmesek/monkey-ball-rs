[package]
name = "mb-desktop"
description = "The desktop program (Windows, Linux, macOS): the window and its event loop, native gamepads, the file dialog, the command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The executable is named after the game, not after a crate.
[[bin]]
name = "monkey-ball"
path = "src/main.rs"

[features]
# The developer option of the command line (`--exit-after`, which the kill test uses). Off in
# `cargo build` / `cargo run`; on for this crate's own test through the dev-dependency below.
dev = []

[dependencies]
# The game; `winit` switches on its keyboard bindings for winit's key codes.
mb-app = { path = "../mb-app", features = ["winit"] }
mb-game = { path = "../mb-game" }
mb-assets = { path = "../mb-assets" }
mb-render = { path = "../mb-render" }
# Window + input event loop (decision recorded in docs/PLAN.md). 0.30 is the latest stable release (0.31 is
# still beta).
winit = "0.30"
# Same wgpu version as mb-render so Device/Queue/Surface types are shared.
wgpu = "30"
# Native "open file" dialog so the disc image can be picked without a command line.
rfd = "0.17"
# Gamepad input (XInput / evdev / IOKit).
gilrs = "0.11"

[dev-dependencies]
# This crate itself with `dev` on: `cargo test` then builds the binary the kill test starts with the
# developer options compiled in, and needs no flag.
mb-desktop = { path = ".", features = ["dev"] }
