[package]
name = "mb-desktop"
description = "The desktop program (Windows, Linux, macOS): the window, native gamepads, the file dialog, the command line, where the game data and saves are kept"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The executable is named after the game, not after a crate.
[[bin]]
name = "monkey-ball"
path = "src/main.rs"

[features]
# The developer option of the command line (`--exit-after`, which the kill test uses). Off in
# `cargo build` / `cargo run`; on for this crate's own test through the dev-dependency below.
dev = []

[dependencies]
mb-app = { path = "../mb-app" }
mb-game = { path = "../mb-game" }
mb-assets = { path = "../mb-assets" }
# The event loop, the surface and the frame; this crate is its `Platform`.
mb-driver = { path = "../mb-driver" }
# The window's size and fullscreen, the fullscreen key; the driver's version.
winit = "0.30"
# Native "open file" dialog so the disc image can be picked without a command line.
rfd = "0.17"
# Gamepad input (XInput / evdev / IOKit).
gilrs = "0.11"

[dev-dependencies]
# This crate itself with `dev` on: `cargo test` then builds the binary the kill test starts with the
# developer options compiled in, and needs no flag.
mb-desktop = { path = ".", features = ["dev"] }
