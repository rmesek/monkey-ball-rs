[package]
name = "mb-web"
description = "Browser (wasm32) entry point: canvas, file-picker content source, gamepad"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mb-app = { path = "../mb-app" }
mb-assets = { path = "../mb-assets" }
# Same versions as mb-app so the types are shared.
winit = "0.30"
wgpu = { version = "30", features = ["webgl"] }

# Everything below only exists on wasm32 so `cargo check --workspace` on the host stays unchanged.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# JS glue; wasm-bindgen-cli at the same version produces the .js/.wasm pair (scripts/build-web.*).
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "Navigator",
    "Gamepad", "GamepadButton", "GamepadMappingType", "console",
] }
# Panics become console.error messages instead of "unreachable executed".
console_error_panic_hook = "0.1"
