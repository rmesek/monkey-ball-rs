[package]
name = "mb-web"
description = "The browser target (wasm32): disc import, on-device game data and saves, Web Audio, the page's side of the shared driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mb-app = { path = "../mb-app" }
mb-assets = { path = "../mb-assets" }
# The event loop, the surface and the frame; this crate is its `Platform`.
mb-driver = { path = "../mb-driver" }
# The canvas as the driver's window (`WindowAttributesExtWebSys`); the driver's version.
winit = "0.30"
# Same wgpu version as mb-render so the types are shared; `webgl` adds the WebGL2 backend.
wgpu = { version = "30", features = ["webgl"] }

# Everything below only exists on wasm32: on the host this crate is empty, so workspace-wide commands pass.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# JS glue. Pinned exactly: the build tool links wasm-bindgen-cli-support at the same version to produce
# the .js/.wasm pair (`xtask/Cargo.toml`; a test of xtask compares the two).
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlCanvasElement", "Navigator",
    "Gamepad", "GamepadButton", "CssStyleDeclaration", "Storage", "console",
    # The imported game pack is a Blob (a file in the Origin Private File System) read in slices.
    "Blob",
    # Web Audio (crates/mb-web/src/audio.rs).
    "AudioContext", "BaseAudioContext", "AudioContextState", "AudioBuffer", "AudioBufferSourceNode",
    "AudioScheduledSourceNode", "AudioNode", "AudioParam", "AudioDestinationNode", "GainNode",
    "StereoPannerNode", "AnalyserNode", "EventTarget",
] }
# Panics become console.error messages instead of "unreachable executed".
console_error_panic_hook = "0.1"
