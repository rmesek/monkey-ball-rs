[package]
name = "mb-app"
description = "The game as a library, the same on every platform: states (menus, loading, play, HUD), scene assembly, the input, host and content seams. No window, no event loop: the platform drivers (mb-desktop, mb-web) are built on it"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Developer and test support that is not part of the product: the windowless driver and the autopilot the
# integration tests run on, and test doubles (`DeferredPack`, `RecordingBackend`). Off in every product
# build; on for this crate's own tests through the dev-dependency below, and for the desktop program's
# developer options through `mb-desktop`'s `dev` feature.
dev = []
# `input::action_for_key`: the keyboard bindings in terms of winit's key codes, for drivers built on winit.
# Nothing else in this crate knows about a window.
winit = ["dep:winit"]

[dependencies]
mb-assets = { path = "../mb-assets" }
mb-gma = { path = "../mb-gma" }
mb-tpl = { path = "../mb-tpl" }
mb-stage = { path = "../mb-stage" }
mb-render = { path = "../mb-render" }
mb-engine = { path = "../mb-engine" }
mb-game = { path = "../mb-game" }
mb-audio = { path = "../mb-audio" }
# Key codes only, and only with the `winit` feature (see above). The same version as the drivers.
winit = { version = "0.30", optional = true }
# Same wgpu version as mb-render so Device/Queue/Surface types are shared.
wgpu = "30"
# Camera/transform maths shared with mb-render's public API.
glam = "0.30"
# std::time::Instant panics on wasm32; web-time is a drop-in that re-exports std off the web (load and frame
# timings, the browser driver's clock).
web-time = "1"

# Native targets (desktop now, a native Android or iOS app later); the browser has Web Audio and awaits.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Blocks on the async wgpu adapter/device requests (`gpu::request_gpu`; the browser driver awaits them).
pollster = "0.4"
# Audio device output stream (WASAPI / CoreAudio / ALSA; AAudio on Android): pulls PCM from mb-audio's mixer.
cpal = "0.16"

[dev-dependencies]
# This crate itself with `dev` on: `cargo test` then builds the library and the tests with the test support
# compiled in, and needs no flag. `winit` so the key binding test runs when this crate is tested alone.
mb-app = { path = ".", features = ["dev", "winit"] }
