[package]
name = "mb-android"
description = "Android entry point (android-activity NativeActivity): SAF disc import, insets, tilt"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mb-app = { path = "../mb-app" }
mb-assets = { path = "../mb-assets" }
winit = "0.30"
wgpu = "30"

[target.'cfg(target_os = "android")'.dependencies]
# winit 0.30's Android backend is built on android-activity; the `android-native-activity` winit feature selects it.
winit = { version = "0.30", features = ["android-native-activity"] }
android-activity = { version = "0.6", features = ["native-activity"] }
# Tiny JNI + NDK sensor bindings for window insets and the accelerometer.
jni = "0.21"
ndk = "0.9"
log = "0.4"
android_logger = "0.14"
