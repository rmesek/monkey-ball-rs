# One command per thing, the same in every shell on every platform.
[alias]
# The desktop program:  cargo desktop [options]
desktop = "run --release -p mb-desktop --"
# The web site, built and served on http://localhost:8080:  cargo web
web = "run --quiet --release -p xtask -- web"
# The build tool (xtask/src/main.rs):  cargo xtask check | build-web
xtask = "run --quiet --release -p xtask --"
